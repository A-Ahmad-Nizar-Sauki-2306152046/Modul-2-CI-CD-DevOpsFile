<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>All Payments</title></head>
<body>
    <h2>All Payments</h2>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        <tr th:each="payment : ${payments}">
            <td th:text="${payment.id}">ID</td>
            <td th:text="${payment.status}">Status</td>
            <td><a th:href="@{/payment/admin/detail/{id}(id=${payment.id})}">Review</a></td>
        </tr>
    </table>
</body>
</html>
