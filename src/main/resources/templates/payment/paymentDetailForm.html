<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Payment Detail Form</title></head>
<body>
<h2>Check Payment Detail</h2>
<script>
    function searchPayment(event) {
        event.preventDefault();
        const id = document.getElementById('paymentId').value;
        window.location.href = '/payment/detail/' + id;
    }
</script>
<form onsubmit="searchPayment(event)">
    <label>Payment ID:</label>
    <input type="text" id="paymentId" required>
    <button type="submit">Search</button>
</form>
</body>
</html>
